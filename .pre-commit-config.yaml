repos:
  - repo: https://github.com/psf/black
    rev: 23.3.0  # укажите актуальную версию
    hooks:
      - id: black
        args: [--check, --diff, --line-length=88]
  - repo: https://gitlab.com/pycqa/flake8
    rev: 6.0.0
    hooks:
      - id: flake8
        additional_dependencies:
          - flake8-quotes
          - flake8-import-order
          - flake8-bugbear
          - flake8-comprehensions
