stages:
  - linting
  - test

flake8:
  stage: linting
  image: registry.gitlab.com/pipeline-components/flake8:latest
  script:
    - flake8 --max-line-length=88 --ignore=Q000,Q001,Q002,Q003 .
  only:
    - main
    - merge_requests


black:
  stage: linting
  image: registry.gitlab.com/pipeline-components/black:latest
  script:
    - black --check .
  only:
    - main
    - merge_requests

django:
  stage: test
  before_script:
    - pip install --upgrade pip
    - pip install -r ./requirements/test.txt
  script:
    - python3 .\lyceum\manage.py test lyceum
  only:
    - main
    - merge_requests
  