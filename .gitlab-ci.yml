stages:
  - dependencies
  - lint
  - test

# Проверка зависимостей
check_dependencies:
  stage: dependencies
  image: python:3.12
  before_script:
    - pip install --upgrade pip
  script:
    - pip install -r requirements/prod.txt
    - pip install -r requirements/dev.txt
    - pip install -r requirements/test.txt
  only:
    - main
    - merge_requests

# Линтинг кода с помощью flake8
flake8:
  stage: lint
  image: python:3.12
  before_script:
    - pip install --upgrade pip
    - pip install -r requirements/dev.txt
  script:
    - flake8 .
  only:
    - main
    - merge_requests

# Проверка Black (без изменения файлов)
black:
  stage: lint
  image: python:3.12
  before_script:
    - pip install --upgrade pip
    - pip install black
  script:
    - black --check .
  only:
    - main
    - merge_requests

# Проверка порядка импортов, стиля имён и кавычек
flake8_extended:
  stage: lint
  image: python:3.12
  before_script:
    - pip install --upgrade pip
    - pip install -r requirements/dev.txt
    - pip install flake8 flake8-quotes flake8-import-order
  script:
    - flake8 .
  only:
    - main
    - merge_requests