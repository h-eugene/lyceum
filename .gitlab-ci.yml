stages:
  - linting
  - testing

flake8:
  stage: linting
  image: registry.gitlab.com/pipeline-components/flake8:latest
  script:
    - flake8 .
  only:
    - main
    - merge_requests


black:
  stage: linting
  image: registry.gitlab.com/pipeline-components/black:latest
  script:
    - black . --check --diff -l 79 --preview
  only:
    - main
    - merge_requests

django:
  stage: testing
  image: python:3.12
  before_script:
    - pip install --upgrade pip
    - pip install -r ./requirements/test.txt
  script:
    - cd lyceum
    - python manage.py test
  only:
    - main
    - merge_requests
  