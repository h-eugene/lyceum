image: python:3.12

stages:
  - install
  - linting

check_dependencies:
  stage: install
  image: python:3.12
  before_script:
    - pip install --upgrade pip
  script:
    - pip install -r requirements/dev.txt
    - pip install -r requirements/test.txt
  only:
    - main
    - merge_requests


flake8:
  stage: linting
  image: registry.gitlab.com/pipeline-components/flake8:latest
  script:
    - flake8 --max-line-length=88 --ignore=Q000,Q001,Q002,Q003 .
  only:
    - main
    - merge_requests


Black:
  stage: linting
  image: registry.gitlab.com/pipeline-components/black:latest
  script:
    - black --check .
  only:
    - main
    - merge_requests