stages:
  - dependencies
  - lint

check_dependencies:
  stage: dependencies
  image: python:3.12
  before_script:
    - pip install --upgrade pip
  script:
    - pip install -r requirements/prod.txt
    - pip install -r requirements/dev.txt
    - pip install -r requirements/test.txt
  only:
    - main
    - merge_requests

precommit:
  stage: lint
  image: python:3.12
  before_script:
    - pip install --upgrade pip
    - pip install pre-commit
  script:
    - pre-commit run --all-files --hook-stage=ci
  only:
    - main
    - merge_requests