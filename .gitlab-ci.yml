stages:
  - dependencies
  - lint
  - test

# Проверка зависимостей
check_dependencies:
  stage: dependencies
  image: python:3.12
  before_script:
    - pip install --upgrade pip
  script:
    - pip install -r requirements/prod.txt
    - pip install -r requirements/dev.txt
    - pip install -r requirements/test.txt
  only:
    - main
    - merge_requests

# Линтинг кода с помощью flake8
flake8:
  stage: lint
  image: python:3.12
  before_script:
    - pip install --upgrade pip
    - pip install -r requirements/dev.txt
  script:
    - flake8 --ignore=Q000,Q001,Q002,Q003 .  # Отключаем проверку кавычек
  only:
    - main
    - merge_requests

# Проверка Black (без изменения файлов, согласование с flake8)
black:
  stage: lint
  image: python:3.12
  before_script:
    - pip install --upgrade pip
    - pip install black
  script:
    - black --check --line-length=79 .
  only:
    - main
    - merge_requests

# Проверка порядка импортов, стиля имён
flake8_extended:
  stage: lint
  image: python:3.12
  before_script:
    - pip install --upgrade pip
    - pip install -r requirements/dev.txt
    - pip install flake8 flake8-import-order
  script:
    - flake8 --ignore=Q000,Q001,Q002,Q003 .
  only:
    - main
    - merge_requests