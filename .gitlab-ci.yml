stages:
  - dependencies
  - lint
  - black

check_dependencies:
  stage: dependencies
  image: python:3.12
  before_script:
    - pip install --upgrade pip
  script:
    - pip install -r requirements/prod.txt
    - pip install -r requirements/dev.txt
    - pip install -r requirements/test.txt
  only:
    - main
    - merge_requests

black:
  stage: black
  image: python:3.12
  before_script:
    - pip install --upgrade pip
    - pip install black
  script:
    - black --check --diff .
  only:
    - main
    - merge_requests

flake8:
  stage: lint
  image: python:3.12
  before_script:
    - pip install --upgrade pip
    - pip install -r requirements/dev.txt
    - pip install flake8 flake8-quotes flake8-import-order flake8-bugbear flake8-comprehensions pep8-naming
  script:
    - flake8 --max-line-length=88 --ignore=Q000,Q001,Q002,Q003 .
  only:
    - main
    - merge_requests