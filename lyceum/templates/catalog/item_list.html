{% extends 'base.html' %}

{% block title %}FurFriends — Список товаров{% endblock %}

{% block content %}
    <h1 class="text-center mb-4" style="color: #ff6b6b;">Список товаров</h1>
    <div class="row row-cols-1 row-cols-md-2 g-4 justify-content-center">
        {% for item in items %}
            {% include 'catalog/item_card.html' with item=item %}
        {% empty %}
            <p class="text-center">Нет доступных товаров.</p>
        {% endfor %}
    </div>
{% endblock %}
