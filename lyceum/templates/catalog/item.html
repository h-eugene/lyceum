{% extends 'base.html' %}
{% load static %}

{% block title %}FurFriends — {{ name }}{% endblock %}

{% block content %}
    <div class="container py-1">
        <h1 class="text-center mb-4 title">Питомец</h1>
        <div class="row justify-content-center">
            <div class="col-12 col-md-6 d-flex justify-content-center">
                <div class="card h-100 bg-dark text-light shadow-sm" style="border-radius: 10px; max-width: 300px;">
                    <img src="{% static image %}" alt="{{ name }}" class="img-fluid" style="width: 300px; height: 300px; object-fit: cover;">
                    <div class="card-body d-flex flex-column justify-content-between p-3" style="background-color: #2d2d2d;">
                        <div>
                            <h2 class="card-title">{{ name }}</h2>
                            <p class="card-text">{{ description }}</p>
                        </div>
                        <a href="{% url 'item_list' %}" class="btn btn-secondary mt-3">Вернуться к списку</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
