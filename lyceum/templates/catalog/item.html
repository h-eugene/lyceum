{% extends 'base.html' %}
{% load static %}

{% block title %}Товар{% endblock %}

{% block content %}
    <h1 class="text-center mb-4">Товар</h1>
    <div class="row">
        <div class="col-md-6">
            <img src="{% static image %}" alt="Товар" class="img-fluid" style="max-width: 300px;">
        </div>
        <div class="col-md-6">
            <h2>{{ name }}</h2>
            <p>{{ description }}</p>
        </div>
    </div>
{% endblock %}
