{% load static %}
<div class="col">
    <div class="card bg-dark text-light border-0 shadow-sm item-card">
        <div class="row g-0 h-100">
            <div class="col-md-6 d-flex">
                <img src="{% static item.image %}" alt="{{ item.name }}" class="img-fluid item-image">
            </div>
            <div class="col-md-6 h-100 d-flex flex-column p-3 item-info">
                <div class="flex-grow-1 overflow-auto">
                    <h5 class="card-title">{{ item.name }}</h5>
                    <p class="card-text">{{ item.description }}</p>
                </div>
                <a href="{% url 'item_detail' pk=item.pk %}" class="btn btn-primary mt-3">Подробнее</a>
            </div>
        </div>
    </div>
</div>
