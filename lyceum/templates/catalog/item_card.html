{% load static %}
<div class="col">
    <div class="card h-100 bg-dark text-light border-0 shadow-sm" style="border-radius: 10px; transition: transform 0.3s ease, box-shadow 0.3s ease; overflow: hidden;">
        <div class="row g-0">
            <div class="col-md-6 d-flex align-items-center justify-content-center">
                <img src="{% static item.image %}" alt="{{ item.name }}" class="img-fluid" style="width: 300px; height: 300px;">
            </div>
            <div class="col-md-6 d-flex flex-column justify-content-between p-3" style="height: 300px; background-color: #2d2d2d;">
                <div>
                    <h5 class="card-title">{{ item.name }}</h5>
                    <p class="card-text">{{ item.description }}</p>
                </div>
                <a href="{% url 'item_detail' pk=item.pk %}" class="btn btn-primary mt-3">Подробнее</a>
            </div>
        </div>
    </div>
</div>

<style>
    .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
    }
</style>
