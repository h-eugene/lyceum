{% load static %}
<div class="col">
    <div class="card h-100 bg-dark text-light border-0 shadow-sm" style="border-radius: 10px; transition: transform 0.3s ease, box-shadow 0.3s ease;">
        <img src="{% static item.image %}" alt="{{ item.name }}" class="card-img-top" style="width: 300px; height: 300px; object-fit: cover; border-top-left-radius: 10px; border-top-right-radius: 10px;">
        <div class="card-body d-flex flex-column justify-content-between" style="min-height: 200px; padding: 1rem; max-width: 300px; margin: 0 auto;">
            <div>
                <h5 class="card-title">{{ item.name }}</h5>
                <p class="card-text">{{ item.description }}</p>
            </div>
            <a href="{% url 'item_detail' pk=item.pk %}" class="btn btn-primary mt-3">Подробнее</a>
        </div>
    </div>
</div>

<style>
    .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
    }
    .card-img-top {
        margin: 0 auto; /* Центрируем изображение горизонтально */
        display: block; /* Убедимся, что изображение ведёт себя как блок */
    }
    .card-body {
        background-color: #2d2d2d; /* Сохраняем тёмный фон для тела карточки */
        border-bottom-left-radius: 10px;
        border-bottom-right-radius: 10px;
    }
</style>
