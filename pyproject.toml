[tool.lint.flake8]
max-line-length = 79
application-import-names = ["about", "catalog", "core", "download", "homepage"]
import-order-style = "google"
exclude = ["*/migrations/"]
inline-quotes = "double"



[tool.black]
line-length = 79
skip-string-normalization = true


[tool.ruff]
line-length = 79


[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true